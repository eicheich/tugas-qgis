<!DOCTYPE html>
<html>
<head>
  <title>Leaflet preview</title>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin=""></script>
  <style type="text/css">
    body {margin: 0;padding: 0;} 
    html, body, #map{width: 100%;height: 100%;}
  </style>
</head>
<body>
  <div id="map"></div>
  
  <!-- Watermark ditaruh di dalam body -->
  <div style="position: absolute; bottom: 30px; left: 10px; z-index: 9999; background-color: rgba(255, 255, 255, 0.85); padding: 8px 12px; border-radius: 8px; font-family: Arial, sans-serif; font-size: 14px; font-weight: bold; color: #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); pointer-events: none;">
    © 2026 Tugas Peta - [Husnul Khotimah - J0403241127] - Stadium di Jakarta
  </div>

  <script>
    var map = L.map('map', {attributionControl: false}).setView([-6.21772, 106.841], 13);
    L.control.attribution({prefix: false}).addTo(map);
    
    // Path diubah ke relative path (asumsi folder mbtiles ada di sebelah file index.html)
    var tilesource_layer = L.tileLayer('./{z}/{x}/{y}.png', {
      minZoom: 12, 
      maxZoom: 14, 
      tms: false, 
      attribution: 'Created by QGIS'
    }).addTo(map);
  </script>
</body>
</html>
